services:
  web:
    build: .
    container_name: hamza-analyst-web
    ports:
      - "8086:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: hamza-analyst-api
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - messages:/app/data
    restart: unless-stopped

volumes:
  messages:
