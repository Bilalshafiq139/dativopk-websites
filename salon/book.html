<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an Appointment · Zeenat Salon & Studio</title>
<meta name="description" content="Zeenat Salon & Studio, a ladies salon in Gulberg, Lahore: haircuts, colour, keratin, bridal and party makeup, facials, nails and mehndi. Book online.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main id="main">
  <section class="page-hero" style="padding-bottom:60px"><img src="assets/img/hero.webp" alt=""><div class="wrap"><h1><span class="line-in"><span style="animation-delay:.15s">Book your <em>appointment</em></span></span></h1><p class="fade-in" style="animation-delay:.45s">Four quick steps. We confirm every booking on WhatsApp within the hour.</p></div></section>
  <section class="sec-tight"><div class="wrap book">
    <div class="card"><div class="steps" id="steps"><span></span><span></span><span></span><span></span></div><div id="step"></div></div>
    <aside class="card summary" id="sum"></aside>
  </div></section>
</main>
<script type="module">
import { init, $, $$, esc, toast } from "./js/layout.js";
import { SERVICES, STYLISTS, BRIDAL, img, rs, serviceById } from "./js/data.js";
import * as S from "./js/store.js";
init("book");
const q = new URLSearchParams(location.search);
const st = { service: "", sub: "", price: 0, stylist: q.get("stylist") || "", date: "", time: "", step: 0 };
if (q.get("service") === "bridal-package") { const p = BRIDAL.find((b) => b.id === q.get("pkg")) || BRIDAL[1]; Object.assign(st, { service: "bridal-package", sub: p.name + " (bridal package)", price: p.price, step: 1 }); }
else if (serviceById(q.get("service"))) { st.service = q.get("service"); }
const SLOTS = ["11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];
const fmtT = (t) => { const [h, m] = t.split(":").map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "am" : "pm"}`; };
const dayStr = (d) => d.toISOString().slice(0, 10);
function summary() {
  const s = serviceById(st.service);
  $("#sum").innerHTML = `<h3 style="font-size:26px;margin-bottom:12px">Your booking</h3>
    <div class="row"><span>Service</span><span>${st.sub ? esc(st.sub) : s ? esc(s.name) : "Not chosen"}</span></div>
    <div class="row"><span>Stylist</span><span>${st.stylist ? esc(st.stylist) : "Any available"}</span></div>
    <div class="row"><span>Date</span><span>${st.date ? new Date(st.date + "T00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "-"}</span></div>
    <div class="row"><span>Time</span><span>${st.time ? fmtT(st.time) : "-"}</span></div>
    <div class="total">${st.price ? rs(st.price) : "-"}</div><p class="muted small" style="margin:6px 0 0">Pay at the salon. Bridal bookings need a 30% advance.</p>`;
  $$("#steps span").forEach((x, i) => x.classList.toggle("on", i <= st.step));
}
async function render() {
  summary(); const el = $("#step");
  if (st.step === 0) {
    const s = serviceById(st.service);
    el.innerHTML = `<div class="panel-step"><h2 style="font-size:30px;margin-bottom:6px">Choose a service</h2><p class="muted">Pick a category, then the exact treatment.</p>
      <div class="opts" style="margin-top:18px">${SERVICES.map((x) => `<button class="opt${x.id === st.service ? " on" : ""}" data-s="${x.id}"><img src="${img(x.img)}" alt=""><span><b>${esc(x.name)}</b><small>from ${rs(x.price)}</small></span></button>`).join("")}</div>
      ${s ? `<h3 style="font-size:20px;margin:26px 0 12px">${esc(s.name)}: which one?</h3><div class="opts">${s.items.map(([n, p]) => `<button class="opt${st.sub === n ? " on" : ""}" data-sub="${esc(n)}" data-p="${p}" style="padding:16px"><span><b>${esc(n)}</b><small>${rs(p)}</small></span></button>`).join("")}</div>` : ""}
      <div class="nav-btns"><span></span><button class="btn btn-dark" id="next" ${st.sub ? "" : "disabled"}>Next: stylist</button></div></div>`;
  }
  if (st.step === 1) {
    el.innerHTML = `<div class="panel-step"><h2 style="font-size:30px;margin-bottom:6px">Choose your stylist</h2><p class="muted">Or let us pick the best available artist.</p>
      <div class="opts" style="margin-top:18px"><button class="opt${!st.stylist ? " on" : ""}" data-st=""><span style="width:58px;height:58px;border-radius:14px;background:var(--cream-2);display:grid;place-items:center;font-size:22px">✦</span><span><b>Any available</b><small>Fastest booking</small></span></button>
      ${STYLISTS.map((x) => `<button class="opt${st.stylist === x.name ? " on" : ""}" data-st="${esc(x.name)}"><img src="${img(x.id)}" alt="" style="object-position:center 20%"><span><b>${esc(x.name)}</b><small>${esc(x.skill)}</small></span></button>`).join("")}</div>
      <div class="nav-btns"><button class="btn btn-line" id="back">Back</button><button class="btn btn-dark" id="next">Next: date &amp; time</button></div></div>`;
  }
  if (st.step === 2) {
    const days = [...Array(14)].map((_, i) => new Date(Date.now() + i * 864e5));
    if (!st.date) st.date = dayStr(days[0]);
    const busy = await S.busySlots(st.date);
    const now = new Date();
    const taken = (t) => { const when = new Date(st.date + "T" + t); if (when < now) return true; return busy.some((b) => new Date(b.date).getHours() === when.getHours() && (!st.stylist || b.stylist === st.stylist)); };
    el.innerHTML = `<div class="panel-step"><h2 style="font-size:30px;margin-bottom:16px">Pick a date &amp; time</h2>
      <div class="days">${days.map((d) => `<button class="day${dayStr(d) === st.date ? " on" : ""}" data-d="${dayStr(d)}"><small>${d.toLocaleDateString("en-GB", { weekday: "short" })}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString("en-GB", { month: "short" })}</small></button>`).join("")}</div>
      <div class="slots">${SLOTS.map((t) => `<button class="slot${st.time === t ? " on" : ""}" data-t="${t}" ${taken(t) ? "disabled" : ""}>${fmtT(t)}</button>`).join("")}</div>
      <p class="muted small" style="margin-top:12px">Crossed-out times are already booked${st.stylist ? " with " + esc(st.stylist) : ""}.</p>
      <div class="nav-btns"><button class="btn btn-line" id="back">Back</button><button class="btn btn-dark" id="next" ${st.time ? "" : "disabled"}>Next: your details</button></div></div>`;
  }
  if (st.step === 3) {
    el.innerHTML = `<form class="panel-step" id="bf" novalidate><h2 style="font-size:30px;margin-bottom:16px">Your details</h2>
      <div class="two"><div class="field"><label for="n">Name</label><input id="n" name="name" autocomplete="name"></div><div class="field"><label for="p">Mobile (WhatsApp)</label><input id="p" name="phone" autocomplete="tel" placeholder="03xx xxxxxxx"></div></div>
      <div class="field"><label for="m">Anything we should know? (optional)</label><textarea id="m" name="message" placeholder="Hair length, event time, outfit colour..."></textarea></div>
      <p class="err" id="err"></p>
      <div class="nav-btns"><button type="button" class="btn btn-line" id="back">Back</button><button class="btn btn-dark" id="send">Confirm booking</button></div></form>`;
    $("#bf").onsubmit = async (e) => {
      e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
      if (d.name.trim().length < 2 || !/^[0-9+\-\s]{10,16}$/.test(d.phone.trim())) { $("#err").textContent = "Please add your name and a valid mobile number."; return; }
      $("#send").disabled = true;
      try {
        const o = await S.book({ service: st.service, sub: st.sub, price: st.price, stylist: st.stylist || "Any available", date: new Date(st.date + "T" + st.time).toISOString(), name: d.name, phone: d.phone, message: d.message });
        st.step = 4; summary(); $$("#steps span").forEach((x) => x.classList.add("on"));
        el.innerHTML = `<div class="ok panel-step"><div class="tick">✓</div><h2 style="font-size:34px">You're booked, ${esc(d.name.split(" ")[0])}!</h2><p class="muted" style="max-width:440px;margin:12px auto 0">We'll confirm on WhatsApp within the hour. Booking reference <b>${esc(o.id)}</b>. Please arrive 10 minutes early.</p><a class="btn btn-dark" href="index.html" style="margin-top:20px">Back to home</a></div>`;
        toast("Booking request sent");
      } catch (er) { $("#err").textContent = er.message; $("#send").disabled = false; }
    };
  }
}
$("#step").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.s) { st.service = b.dataset.s; st.sub = ""; st.price = 0; return render(); }
  if (b.dataset.sub !== undefined) { st.sub = b.dataset.sub; st.price = Number(b.dataset.p); return render(); }
  if (b.dataset.st !== undefined) { st.stylist = b.dataset.st; st.time = ""; return render(); }
  if (b.dataset.d) { st.date = b.dataset.d; st.time = ""; return render(); }
  if (b.dataset.t) { st.time = b.dataset.t; return render(); }
  if (b.id === "next") { st.step++; return render(); }
  if (b.id === "back") { st.step--; if (st.step === 0 && st.service === "bridal-package") st.step = 1; return render(); }
});
render();
</script>
<script src="../dativo-lead.js" defer></script>
</body>
</html>
