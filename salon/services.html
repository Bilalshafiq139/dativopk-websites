<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services & Rates · Zeenat Salon & Studio</title>
<meta name="description" content="Zeenat Salon & Studio, a ladies salon in Gulberg, Lahore: haircuts, colour, keratin, bridal and party makeup, facials, nails and mehndi. Book online.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main id="main">
  <section class="page-hero"><img src="assets/img/interior2.webp" alt=""><div class="wrap"><h1><span class="line-in"><span style="animation-delay:.15s">Services &amp; <em>rates</em></span></span></h1><p class="fade-in" style="animation-delay:.45s">Clear prices in PKR, no surprises. Final price depends on hair length and the products you choose.</p></div></section>
  <section class="sec-tight"><div class="wrap" id="cats"></div></section>
  <section class="sec-tight" style="padding-top:0"><div class="wrap" id="cb"></div></section>
</main>
<script type="module">
import { init, $, esc, callbackHtml } from "./js/layout.js";
import { CATS, SERVICES, img, rs } from "./js/data.js";
$("#cats").innerHTML = CATS.map(([c, n]) => `<div class="rate-cat"><div><h2 class="reveal">${esc(n)}</h2></div><div class="rate-list">${SERVICES.filter((s) => s.cat === c).map((s, i) => `
  <div class="rate-item reveal" style="--i:${i}" id="${s.id}"><img src="${img(s.img)}" alt="" loading="lazy"><div><h3>${esc(s.name)} <a class="btn btn-sm btn-dark" href="book.html?service=${s.id}">Book</a></h3><p class="muted small" style="margin:4px 0 0">${esc(s.note)} · about ${Math.round(s.mins / 15) * 15} min</p>
  <ul>${s.items.map(([n, p]) => `<li><span>${esc(n)}</span><span>${rs(p)}</span></li>`).join("")}</ul></div></div>`).join("")}</div></div>`).join("");
$("#cb").innerHTML = callbackHtml();
init("services");
if (location.hash) setTimeout(() => document.querySelector(location.hash)?.scrollIntoView({ block: "center" }), 400);
</script>
<script src="../dativo-lead.js" defer></script>
</body>
</html>
