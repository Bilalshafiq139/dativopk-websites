<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Zeenat Salon & Studio</title>
<meta name="description" content="Zeenat Salon & Studio, a ladies salon in Gulberg, Lahore: haircuts, colour, keratin, bridal and party makeup, facials, nails and mehndi. Book online.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main id="main">
  <section class="page-hero"><img src="assets/img/interior2.webp" alt=""><div class="wrap"><h1><span class="line-in"><span style="animation-delay:.15s">Visit <em>us</em></span></span></h1><p class="fade-in" style="animation-delay:.45s">Gulberg III, Lahore. Free parking in front of the salon.</p></div></section>
  <section class="sec-tight"><div class="wrap contact">
    <div><div class="map reveal"><iframe title="Map" loading="lazy" id="map"></iframe></div><div class="info" id="info"></div></div>
    <div class="card reveal"><h2 style="font-size:32px;margin-bottom:16px">Ask us <em>anything</em></h2>
      <form id="cf" novalidate><div class="two"><div class="field"><label for="n">Name</label><input id="n" name="name" autocomplete="name"></div><div class="field"><label for="p">Mobile</label><input id="p" name="phone" autocomplete="tel" placeholder="03xx xxxxxxx"></div></div>
        <div class="field"><label for="t">About</label><select id="t" name="topic"><option>Hair</option><option>Bridal makeup</option><option>Party makeup</option><option>Skin &amp; facials</option><option>Home / venue service</option><option>Other</option></select></div>
        <div class="field"><label for="m">Message</label><textarea id="m" name="message"></textarea></div><p class="err" id="err"></p><button class="btn btn-dark">Send message</button></form></div>
  </div></section>
</main>
<script type="module">
import { init, $, esc } from "./js/layout.js";
import { SALON } from "./js/data.js";
import * as S from "./js/store.js";
$("#map").src = SALON.map;
$("#info").innerHTML = [["Address", SALON.address], ["WhatsApp", SALON.phone], ["Email", SALON.email], ...SALON.hours].map(([a, b], i) => `<div class="reveal" style="--i:${i}"><span class="muted">${esc(a)}</span><b>${esc(b)}</b></div>`).join("");
init("contact");
$("#cf").onsubmit = async (e) => {
  e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
  if (d.name.trim().length < 2 || !/^[0-9+\-\s]{10,16}$/.test(d.phone.trim()) || d.message.trim().length < 3) { $("#err").textContent = "Please add your name, mobile number and a message."; return; }
  try { await S.callback(d); e.target.innerHTML = '<div class="ok"><div class="tick">✓</div><h3 style="font-size:26px">Message sent</h3><p class="muted">We\'ll reply on WhatsApp soon.</p></div>'; } catch (er) { $("#err").textContent = er.message; }
};
</script>
<script src="../dativo-lead.js" defer></script>
</body>
</html>
