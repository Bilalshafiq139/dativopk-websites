<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our agents · Arz Estate</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<main id="main">
  <section class="page-head" id="ph"></section>
  <section class="sec-tight"><div class="wrap">
    <div class="tabs-row stabs" id="city" style="margin-bottom:14px"></div>
    <div class="grid grid-3" id="grid"></div>
  </div></section>
</main>
<script type="module">
import { init, $, $$, esc, icon, reveal } from "./js/layout.js";
import { pageHead } from "./js/page.js";
import { AGENTS, LISTINGS, img, BRAND } from "./js/data.js";
await init("agents");
pageHead($("#ph"), { crumb: "Agents", title: "Expert agents who know every street", text: "Six full-time consultants across three cities. Every one is licensed, and every review is from a real client." });
let city = "";
$("#city").innerHTML = [["", "All cities"], ["Lahore", "Lahore"], ["Islamabad", "Islamabad"], ["Karachi", "Karachi"]].map(([c, n]) => `<button data-c="${c}" class="${c === city ? "on" : ""}">${n}</button>`).join("");
function draw() {
  const g = $("#grid"); g.classList.remove("grid-anim"); void g.offsetWidth;
  g.innerHTML = AGENTS.filter((a) => !city || a.city === city).map((a, i) => {
    const n = LISTINGS.filter((l) => l.agent === a.id).length;
    return `<article class="agent" id="${a.id}" style="--i:${i}"><div class="ag-photo" style="aspect-ratio:1/1"><img src="${img(a.id)}" alt="${esc(a.name)}" loading="lazy"><span class="logo"><span>Arz</span><span>Estate</span></span></div>
    <div class="ag-body"><b>${esc(a.name)}</b><small>${esc(a.role)} · ${esc(a.city)}</small>
      <div class="ag-rate">${a.rating.toFixed(1)} <span>/ ${a.reviews} reviews · ${a.deals} deals · ${n} live listing${n === 1 ? "" : "s"}</span></div>
      <div class="ag-actions"><a class="btn btn-sm" href="tel:${a.phone.replace(/\s/g, "")}">${esc(a.phone)}</a><a class="icon-btn" href="${BRAND.whatsapp}" target="_blank" rel="noopener" aria-label="WhatsApp ${esc(a.name)}">${icon.at}</a></div></div></article>`;
  }).join("");
  g.classList.add("grid-anim");
}
$("#city").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; city = b.dataset.c; $$("#city button").forEach((x) => x.classList.toggle("on", x === b)); draw(); });
draw(); reveal();
if (location.hash) setTimeout(() => document.querySelector(location.hash)?.scrollIntoView({ block: "center" }), 300);
</script>
<script src="../dativo-lead.js" defer></script>
</body>
</html>
