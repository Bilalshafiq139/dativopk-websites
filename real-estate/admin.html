<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent dashboard · Arz Estate</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<style>
  body { background: var(--bg); }
  .adm { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .side { background: #111; color: #bbb; padding: 22px 14px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; }
  .side .logo { color: #fff; margin: 0 8px 26px; }
  .side button { text-align: left; background: none; border: 0; color: inherit; padding: 10px 12px; cursor: pointer; font-size: 13.5px; display: flex; justify-content: space-between; }
  .side button.on, .side button:hover { background: #222; color: #fff; }
  .side .badge { background: #fff; color: #111; font-size: 11px; padding: 0 7px; }
  .side .bottom { margin-top: auto; display: grid; gap: 4px; font-size: 12.5px; }
  .content { padding: 28px 32px 60px; min-width: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; gap: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 40px; letter-spacing: -.04em; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 160px; margin: 14px 0 22px; }
  .chart div { flex: 1; background: #111; min-height: 3px; position: relative; opacity: .85; }
  .chart div span { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #999; }
  .hbar { display: grid; grid-template-columns: 140px 1fr 30px; gap: 10px; align-items: center; font-size: 13px; margin: 8px 0; }
  .hbar .t { height: 6px; background: var(--soft); } .hbar .t span { display: block; height: 100%; background: #111; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #999; font-weight: 400; padding: 10px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--bg); }
  .st { display: inline-block; padding: 2px 9px; font-size: 11.5px; background: var(--soft); white-space: nowrap; text-transform: capitalize; }
  .st-new { background: #111; color: #fff; } .st-closed, .st-listed { background: #dcefe3; color: #1d6b3a; } .st-lost, .st-rejected { background: #f3dddd; color: #8a2b2b; } .st-viewing, .st-offer { background: #e6e6f5; color: #33338a; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { height: 32px; padding: 0 12px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 12.5px; text-transform: capitalize; }
  .chip.on { background: #111; color: #fff; border-color: #111; }
  .detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: #fff; z-index: 80; box-shadow: -30px 0 60px -30px rgba(0,0,0,.35); padding: 26px; overflow: auto; transform: translateX(100%); transition: transform .45s var(--ease); }
  .detail.open { transform: none; }
  .thumb { width: 54px; height: 40px; object-fit: cover; }
  .num { width: 140px; height: 34px; border: 1px solid var(--line); padding: 0 8px; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login form { width: min(380px, 100%); }
  .demo-flag { background: #fff3cd; color: #7a5b00; padding: 3px 10px; font-size: 12px; }
  @media (max-width: 900px) { .adm { grid-template-columns: 1fr; } .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; } .side .logo { width: 100%; margin-bottom: 10px; } .side .bottom { display: none; } .kpis { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; } .content { padding: 20px 14px; } .hide-m { display: none; } }
</style>
<div id="app"></div>
<script type="module">
import { LISTINGS, cover, priceLabel, pkr, AGENTS } from "./js/data.js";
import * as S from "./js/store.js";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stCls = (s) => "st st-" + String(s).split(" ")[0];
const dt = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const logo = '<a class="logo" href="index.html"><span>Arz</span><span>Estate</span></a>';
const demo = await S.isDemo();
let data = { leads: [], messages: [], submissions: [] }, view = "overview", filter = "all", q = "";

function loginView(err = "") {
  $("#app").innerHTML = `<div class="login"><form class="panel" id="lf">${logo}<h1 style="font-size:34px;margin:22px 0 6px">Agent login</h1><p class="muted small">Leads, listings and messages.</p>
    <div class="field" style="margin-top:18px"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus></div>
    <p style="color:#c0392b;font-size:13px;min-height:18px;margin:8px 0">${esc(err)}</p><button class="btn btn-block">Sign in</button>
    ${demo ? '<p class="muted small" style="margin-top:12px;text-align:center">Demo password: <b>admin123</b></p>' : ""}</form></div>`;
  $("#lf").addEventListener("submit", async (e) => { e.preventDefault(); try { await S.login($("#pw").value); await load(); } catch (er) { loginView(er.message); } });
}
async function load() { try { data = await S.adminData(); } catch (e) { S.logout(); return loginView(e.message); } await S.loadOverrides(); shell(); }
function shell() {
  const nl = data.leads.filter((x) => x.status === "new").length, nm = data.messages.filter((x) => x.status === "new").length, ns = data.submissions.filter((x) => x.status === "new").length;
  $("#app").innerHTML = `<div class="adm"><nav class="side" aria-label="Admin">${logo}
    ${[["overview", "Overview", 0], ["leads", "Leads", nl], ["listings", "Listings", 0], ["submissions", "Submitted properties", ns], ["messages", "Messages", nm]].map(([id, l, n]) => `<button data-view="${id}" class="${view === id ? "on" : ""}">${l}${n ? `<span class="badge">${n}</span>` : ""}</button>`).join("")}
    <div class="bottom">${demo ? '<button id="reset">Reset demo data</button>' : ""}<a href="index.html" style="padding:6px 12px">← View website</a><button id="out">Sign out</button></div></nav>
    <section class="content" id="content"></section></div><aside class="detail" id="detail" aria-label="Lead detail"></aside>`;
  draw();
}
const head = (t, extra = "") => `<div class="top"><h1>${t}</h1><div style="display:flex;gap:10px;align-items:center">${demo ? '<span class="demo-flag">Demo mode · saved in this browser</span>' : ""}${extra}</div></div>`;
function draw() {
  const c = $("#content");
  if (view === "overview") {
    const ls = S.listings(), open = data.leads.filter((x) => !["closed", "lost"].includes(x.status));
    const week = data.leads.filter((x) => x.kind === "Viewing" && x.date && new Date(x.date) - Date.now() < 7 * 864e5 && new Date(x.date) >= new Date(new Date().toDateString()));
    const pipe = open.reduce((s, x) => s + ((LISTINGS.find((l) => l.id === x.listing) || {}).price || 0), 0);
    const days = [...Array(14)].map((_, i) => { const d = new Date(Date.now() - (13 - i) * 864e5); return { l: d.getDate(), v: data.leads.filter((x) => new Date(x.createdAt).toDateString() === d.toDateString()).length }; });
    const mx = Math.max(1, ...days.map((d) => d.v));
    const per = {}; data.leads.forEach((x) => (per[x.listingTitle || x.listing] = (per[x.listingTitle || x.listing] || 0) + 1));
    const top = Object.entries(per).sort((a, b) => b[1] - a[1]).slice(0, 6), mp = Math.max(1, ...top.map((t) => t[1]));
    c.innerHTML = head("Overview") + `<div class="kpis">
      <div class="stat"><small>New leads</small><b>${data.leads.filter((x) => x.status === "new").length}</b></div>
      <div class="stat"><small>Viewings, next 7 days</small><b>${week.length}</b></div>
      <div class="stat"><small>Live listings</small><b>${ls.filter((l) => l.status === "available").length} / ${ls.length}</b></div>
      <div class="stat"><small>Open pipeline</small><b>${pkr(pipe).replace("PKR ", "")}</b></div></div>
      <div class="two"><div class="panel"><small class="muted">Leads per day, last 14 days</small><div class="chart">${days.map((d) => `<div style="height:${(d.v / mx) * 100}%" title="${d.v}"><span>${d.l}</span></div>`).join("")}</div></div>
      <div class="panel"><small class="muted">Most asked-about homes</small>${top.map(([n, v]) => `<div class="hbar"><span>${esc(n)}</span><div class="t"><span style="width:${(v / mp) * 100}%"></span></div><span>${v}</span></div>`).join("")}</div></div>
      <div class="panel" style="margin-top:12px"><small class="muted">Upcoming viewings</small><table class="tbl"><tbody>${week.sort((a, b) => a.date.localeCompare(b.date)).map((x) => `<tr class="click" data-lead="${x.id}"><td><b>${dt(x.date)}</b> ${esc(x.time)}</td><td>${esc(x.listingTitle)}</td><td>${esc(x.name)}<br><span class="muted small">${esc(x.phone)}</span></td><td><span class="${stCls(x.status)}">${x.status}</span></td></tr>`).join("") || '<tr><td class="muted">No viewings booked this week.</td></tr>'}</tbody></table></div>`;
  }
  if (view === "leads") {
    const list = data.leads.filter((x) => (filter === "all" || x.status === filter) && (!q || (x.id + x.name + x.phone + x.listingTitle).toLowerCase().includes(q.toLowerCase())));
    c.innerHTML = head("Leads", `<input class="num" style="width:220px" id="q" placeholder="Search name, phone, home" value="${esc(q)}">`) + `<div class="filters">${["all", ...S.LEAD_STATUSES].map((s) => `<button class="chip ${filter === s ? "on" : ""}" data-filter="${s}">${s} (${s === "all" ? data.leads.length : data.leads.filter((x) => x.status === s).length})</button>`).join("")}</div>
      <div class="panel" style="padding:6px 14px;overflow:auto"><table class="tbl"><thead><tr><th>Lead</th><th>Client</th><th>Property</th><th class="hide-m">Type</th><th>Status</th></tr></thead><tbody>
      ${list.map((x) => `<tr class="click" data-lead="${x.id}"><td><b>${x.id}</b><br><span class="muted small">${dt(x.createdAt)}</span></td><td>${esc(x.name)}<br><span class="muted small">${esc(x.phone)}</span></td><td>${esc(x.listingTitle)}</td><td class="hide-m">${esc(x.kind)}${x.date ? `<br><span class="muted small">${dt(x.date)} ${esc(x.time)}</span>` : ""}</td><td><span class="${stCls(x.status)}">${x.status}</span></td></tr>`).join("") || '<tr><td colspan="5" class="muted" style="text-align:center;padding:40px">No leads match.</td></tr>'}</tbody></table></div>`;
    $("#q").addEventListener("input", (e) => { q = e.target.value; const p = e.target.selectionStart; draw(); $("#q").focus(); $("#q").setSelectionRange(p, p); });
  }
  if (view === "listings") {
    c.innerHTML = head("Listings", '<span class="muted small">Changes show on the website right away.</span>') + `<div class="panel" style="padding:6px 14px;overflow:auto"><table class="tbl"><thead><tr><th></th><th>Property</th><th>Price (PKR)</th><th>Status</th><th>Featured</th></tr></thead><tbody>
      ${S.listings().map((l) => `<tr data-lst="${l.id}"><td><img class="thumb" src="${cover(l)}" alt=""></td><td><b>${esc(l.title)}</b><br><span class="muted small">${esc(l.area)}, ${esc(l.city)} · ${priceLabel(l)}</span></td>
        <td><input class="num" type="number" step="100000" value="${l.price}" data-price aria-label="Price"></td>
        <td><select class="sel" style="width:130px" data-status>${["available", "reserved", "sold", "hidden"].map((s) => `<option ${l.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></td>
        <td><input type="checkbox" data-feat ${l.featured ? "checked" : ""} style="width:18px;height:18px;accent-color:#111" aria-label="Featured"></td></tr>`).join("")}</tbody></table></div>`;
  }
  if (view === "submissions") {
    c.innerHTML = head("Submitted properties") + `<div style="display:grid;gap:10px">${data.submissions.map((s) => `<article class="panel" data-sub="${s.id}"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><b>${esc(s.purpose)}: ${esc(s.type)}, ${esc(s.size)} in ${esc(s.area)}, ${esc(s.city)}</b><br><span class="muted small">${esc(s.name)} · ${esc(s.phone)} · ${dt(s.createdAt)}${s.price ? " · asking " + pkr(s.price) : ""}</span></div>
      <select class="sel" style="width:140px" data-sstatus>${S.SUB_STATUSES.map((x) => `<option ${s.status === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>${s.details ? `<p style="margin:10px 0 0">${esc(s.details)}</p>` : ""}</article>`).join("") || '<p class="muted">Nothing submitted yet.</p>'}</div>`;
  }
  if (view === "messages") {
    c.innerHTML = head("Messages") + `<div style="display:grid;gap:10px">${data.messages.map((m) => `<article class="panel" data-msg="${m.id}"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><b>${esc(m.name)}</b> <span class="muted small">· ${esc(m.topic)} · ${dt(m.createdAt)}</span><br><span class="muted small">${esc(m.email)}${m.phone ? " · " + esc(m.phone) : ""}</span></div>
      <select class="sel" style="width:120px" data-mstatus>${S.MSG_STATUSES.map((x) => `<option ${m.status === x ? "selected" : ""}>${x}</option>`).join("")}</select></div><p style="margin:10px 0 0">${esc(m.message)}</p></article>`).join("") || '<p class="muted">No messages.</p>'}</div>`;
  }
}
function openLead(id) {
  const x = data.leads.find((l) => l.id === id); if (!x) return; const d = $("#detail");
  d.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><span class="muted small">${x.id} · ${new Date(x.createdAt).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}</span><button class="icon-btn" id="dClose" aria-label="Close">✕</button></div>
    <h2 style="font-size:32px;margin:16px 0 4px">${esc(x.name)}</h2><p class="muted">${esc(x.phone)}${x.email ? " · " + esc(x.email) : ""}</p>
    <div class="panel" style="background:var(--bg);margin:14px 0"><b>${esc(x.listingTitle)}</b><br><span class="small">${esc(x.kind)}${x.date ? ` · ${dt(x.date)} at ${esc(x.time)}` : ""}</span>${x.message ? `<p class="small" style="margin:8px 0 0">${esc(x.message)}</p>` : ""}</div>
    <div class="form"><div class="field"><label for="dSt">Status</label><select id="dSt">${S.LEAD_STATUSES.map((s) => `<option ${x.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
    <div class="field"><label for="dAg">Agent</label><select id="dAg"><option value="">Unassigned</option>${AGENTS.map((a) => `<option ${x.agent === a.name ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></div>
    <div class="field full"><label for="dN">Notes</label><textarea id="dN">${esc(x.notes)}</textarea></div></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="dSave">Save</button><a class="btn btn-line" target="_blank" rel="noopener" href="https://wa.me/92${esc(String(x.phone).replace(/\D/g, "").replace(/^0/, ""))}">WhatsApp client</a></div>`;
  d.classList.add("open");
  $("#dClose").onclick = () => d.classList.remove("open");
  $("#dSave").onclick = async () => { Object.assign(x, await S.updateItem("leads", x.id, { status: $("#dSt").value, agent: $("#dAg").value, notes: $("#dN").value })); d.classList.remove("open"); shell(); };
}
document.addEventListener("click", async (e) => {
  const v = e.target.closest("[data-view]"); if (v) { view = v.dataset.view; shell(); return; }
  const f = e.target.closest("[data-filter]"); if (f) { filter = f.dataset.filter; draw(); return; }
  const r = e.target.closest("[data-lead]"); if (r) { openLead(r.dataset.lead); return; }
  if (e.target.closest("#out")) { S.logout(); loginView(); }
  if (e.target.closest("#reset") && confirm("Reset all demo leads, messages and listing edits?")) { S.resetDemo(); await load(); }
});
document.addEventListener("change", async (e) => {
  const row = e.target.closest("[data-lst]");
  if (row) { const id = row.dataset.lst;
    if (e.target.matches("[data-price]")) await S.updateListing(id, { price: Math.max(10000, Number(e.target.value) || LISTINGS.find((l) => l.id === id).price) });
    if (e.target.matches("[data-status]")) await S.updateListing(id, { status: e.target.value });
    if (e.target.matches("[data-feat]")) await S.updateListing(id, { featured: e.target.checked });
    e.target.style.outline = "2px solid #0f9d58"; setTimeout(() => (e.target.style.outline = ""), 900); }
  const m = e.target.closest("[data-msg]"); if (m) Object.assign(data.messages.find((x) => x.id === m.dataset.msg), await S.updateItem("messages", m.dataset.msg, { status: e.target.value }));
  const s = e.target.closest("[data-sub]"); if (s) Object.assign(data.submissions.find((x) => x.id === s.dataset.sub), await S.updateItem("submissions", s.dataset.sub, { status: e.target.value }));
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#detail")?.classList.remove("open"); });
S.loggedIn() ? load() : loginView();
</script>
<script src="../dativo-lead.js" defer></script>
</body>
</html>
