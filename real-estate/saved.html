<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved homes · Arz Estate</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<main id="main">
  <section class="page-head" id="ph"></section>
  <section class="sec-tight"><div class="wrap"><div class="grid grid-3" id="grid"></div></div></section>
</main>
<script type="module">
import { init, $, card } from "./js/layout.js";
import { pageHead } from "./js/page.js";
import * as S from "./js/store.js";
await init("properties");
pageHead($("#ph"), { crumb: "Saved homes", title: "Saved homes", text: "Tap the heart on any listing to keep it here. Saved homes stay in this browser." });
function draw() {
  const list = S.saved().map(S.byId).filter(Boolean);
  $("#grid").innerHTML = list.map((l, i) => card(l, i)).join("") || `<div class="empty"><p class="h3">No saved homes yet</p><p class="muted">Browse properties and tap the heart to save the ones you like.</p><a class="btn" href="properties.html">Browse properties</a></div>`;
}
addEventListener("store:change", draw); draw();
</script>
<script src="../dativo-lead.js" defer></script>
</body>
</html>
