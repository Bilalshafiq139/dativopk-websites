<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Zarine</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main"><div class="wrap" style="padding-top:40px" id="root"></div></main>
<script type="module">
import { init, esc, $, icon } from "./js/layout.js";
import { BRAND, money, bagImg } from "./js/data.js";
import * as S from "./js/store.js";
await init("bag");

const CITIES = ["Lahore", "Karachi", "Islamabad", "Rawalpindi", "Faisalabad", "Multan", "Peshawar", "Sialkot", "Gujranwala", "Quetta", "Hyderabad", "Other"];
const gift = () => { try { return localStorage.getItem("zr-gift") === "1"; } catch { return false; } };
const demo = await S.isDemo();

function form() {
  const t = S.totals(gift());
  if (!t.lines.length) {
    $("#root").innerHTML = `<div class="confirm"><p class="display-sm">Your bag is empty</p><p class="muted">Add a bag to check out.</p><a class="btn btn-dark" href="shop.html">Shop bags ${icon.arrow}</a></div>`;
    return;
  }
  $("#root").innerHTML = `
  <p class="crumbs"><a href="cart.html">Bag</a> / Details / Done</p>
  <h1 style="font-size:clamp(44px,6vw,76px);margin-bottom:30px">Checkout</h1>
  <div class="cart-grid">
    <form class="panel" id="co" novalidate>
      <p class="label">Delivery details</p>
      <div class="form">
        <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="phone">Mobile (WhatsApp)</label><input id="phone" name="phone" autocomplete="tel" placeholder="03xx xxxxxxx" required></div>
        <div class="field full"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="city">City</label><select id="city" name="city" required><option value="">Choose city</option>${CITIES.map((c) => `<option>${c}</option>`).join("")}</select></div>
        <div class="field"><label for="postcode">Postal code (optional)</label><input id="postcode" name="postcode" inputmode="numeric"></div>
        <div class="field full"><label for="address">Address</label><input id="address" name="address" autocomplete="street-address" placeholder="House, street, area" required></div>
        <div class="field full"><label for="notes">Note (optional)</label><textarea id="notes" name="notes" rows="3" placeholder="Gift message, best time to call..."></textarea></div>
      </div>
      <p class="label" style="margin-top:26px">Payment</p>
      <div class="pay-opts">
        <label><input type="radio" name="payment" value="Cash on delivery" checked><span><b>Cash on delivery</b><br><span class="muted small">Pay the rider when your bag arrives.</span></span></label>
        <label><input type="radio" name="payment" value="Card"><span><b>Debit or credit card</b><br><span class="muted small">Visa / Mastercard, secure payment link by SMS.</span></span></label>
        <label><input type="radio" name="payment" value="Bank transfer"><span><b>Bank transfer / Easypaisa / JazzCash</b><br><span class="muted small">We send account details on WhatsApp.</span></span></label>
      </div>
      <p id="err" style="color:#a3343f;margin-top:14px"></p>
      <button class="btn btn-dark btn-block" style="height:54px;margin-top:6px" id="place">Place order · ${money(t.total)}</button>
      ${demo ? `<p class="muted small" style="text-align:center;margin-top:10px">Demo store: no payment is taken and nothing is sent.</p>` : ""}
    </form>
    <aside class="panel summary">
      <h3>Your order</h3>
      ${t.lines.map((l) => `<div class="mini-line"><img src="${bagImg(l.p)}" alt=""><span><b>${esc(l.p.name)}</b><br><span class="muted small">${esc(l.p.colour)} · Qty ${l.qty}</span></span><span>${money(l.unit * l.qty)}</span></div>`).join("")}
      <div class="sum-row"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
      <div class="sum-row"><span>Delivery</span><span>${t.delivery ? money(t.delivery) : "Free"}</span></div>
      <label class="check"><input type="checkbox" id="gift" ${gift() ? "checked" : ""}><span><b>Gift wrap</b><br><span class="muted small">Ribbon and a handwritten card.</span></span><span>+${money(BRAND.giftWrap)}</span></label>
      <div class="sum-total"><span>Total</span><b>${money(t.total)}</b></div>
    </aside>
  </div>`;
  $("#gift").addEventListener("change", (e) => {
    try { localStorage.setItem("zr-gift", e.target.checked ? "1" : "0"); } catch {}
    const keep = new FormData($("#co")); form();
    for (const [k, v] of keep) { const el = $("#co").elements[k]; if (el && el.type !== "radio") el.value = v; }
  });
  $("#co").addEventListener("submit", submit);
}

async function submit(e) {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  const bad = [];
  if (d.name.trim().length < 2) bad.push("name");
  if (!/^[0-9+\-\s]{10,15}$/.test(d.phone.trim())) bad.push("phone");
  if (!/^\S+@\S+\.\S+$/.test(d.email.trim())) bad.push("email");
  if (!d.city) bad.push("city");
  if (d.address.trim().length < 6) bad.push("address");
  [...f.elements].forEach((el) => el.style && (el.style.borderColor = bad.includes(el.name) ? "#a3343f" : ""));
  if (bad.length) { $("#err").textContent = "Please check: " + bad.join(", ") + "."; f.elements[bad[0]].focus(); return; }
  $("#place").disabled = true; $("#place").textContent = "Placing order…";
  try {
    const o = await S.placeOrder({ name: d.name, phone: d.phone, email: d.email, city: d.city, address: d.address + (d.postcode ? ", " + d.postcode : ""), notes: d.notes || "", payment: d.payment }, gift());
    try { localStorage.removeItem("zr-gift"); } catch {}
    done(o); scrollTo(0, 0);
  } catch (err) { $("#err").textContent = err.message; $("#place").disabled = false; $("#place").textContent = "Try again"; }
}

function done(o) {
  const first = String(o.name || "").split(" ")[0];
  $("#root").innerHTML = `<div class="confirm">
    <div class="tick">${icon.check.replace('width="14" height="14"', 'width="30" height="30"')}</div>
    <p class="label">Order ${esc(o.id)}</p>
    <h1>Shukriya, ${esc(first)}</h1>
    <p class="muted">Your order is in. We will confirm it on WhatsApp within a few hours and it leaves our Lahore atelier in 1 to 4 days${o.payment === "Cash on delivery" ? ". Please keep the cash ready for the rider." : "."}</p>
    <div class="panel" style="text-align:left;margin-top:24px">
      ${o.items.map((i) => `<div class="sum-row"><span>${i.qty} × ${esc(i.name)}</span><span>${money(i.price * i.qty)}</span></div>`).join("")}
      <div class="sum-row"><span>Delivery</span><span>${o.delivery ? money(o.delivery) : "Free"}</span></div>
      ${o.giftWrap ? `<div class="sum-row"><span>Gift wrap</span><span>${money(o.giftWrap)}</span></div>` : ""}
      <div class="sum-total"><span>Total · ${esc(o.payment)}</span><b>${money(o.total)}</b></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap"><a class="btn btn-dark" href="shop.html">Keep shopping</a><a class="btn btn-line" href="${BRAND.whatsapp}" target="_blank" rel="noopener">Message us on WhatsApp</a></div>
  </div>`;
}
form();
</script>
<script src="../dativo-lead.js" defer></script>
</body>
</html>
