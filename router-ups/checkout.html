<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Jugnu Power</title>
<meta name="description" content="Checkout for your Jugnu Power order. Cash on delivery across Pakistan.">
<meta name="theme-color" content="#f3f3ef">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=7">
<link rel="stylesheet" href="css/light.css?v=3" id="lightcss">
</head>
<body>
<main id="main"><div class="wrap" style="padding-top:130px;padding-bottom:110px" id="root"></div></main>
<script type="module">
import { init, esc, $, img } from "./js/layout.js";
import { BRAND, rs } from "./js/data.js";
import * as S from "./js/store.js";
init("cart");
const CITIES = ["Lahore", "Karachi", "Islamabad", "Rawalpindi", "Faisalabad", "Multan", "Peshawar", "Sialkot", "Gujranwala", "Quetta", "Hyderabad", "Bahawalpur", "Sargodha", "Other"];
const demo = await S.isDemo();

function form() {
  const t = S.totals();
  if (!t.lines.length) { $("#root").innerHTML = `<div class="empty panel"><h2>Your cart is empty</h2><p class="muted">Add a Jugnu to check out.</p><a class="btn btn-lime" href="shop.html" style="margin-top:24px">Shop Jugnu</a></div>`; return; }
  $("#root").innerHTML = `
  <p class="crumbs"><a href="cart.html">Cart</a> / Details / Done</p>
  <h1 style="font-size:clamp(46px,6vw,80px);margin:8px 0 34px">Checkout</h1>
  <div class="cart">
    <form class="panel" id="co" novalidate>
      <h3 style="font-size:20px;margin-bottom:18px">Delivery details</h3>
      <div class="two">
        <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="phone">Mobile (WhatsApp)</label><input id="phone" name="phone" autocomplete="tel" placeholder="03xx xxxxxxx" required></div>
      </div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="two">
        <div class="field"><label for="city">City</label><select id="city" name="city" required><option value="">Choose city</option>${CITIES.map((c) => `<option>${c}</option>`).join("")}</select></div>
        <div class="field"><label for="router">Your router / ISP (optional)</label><input id="router" name="router" placeholder="e.g. PTCL fiber, TP-Link C6"></div>
      </div>
      <div class="field"><label for="address">Address</label><input id="address" name="address" autocomplete="street-address" placeholder="House, street, area" required></div>
      <div class="field"><label for="notes">Note (optional)</label><textarea id="notes" name="notes" rows="3" placeholder="Landmark, best time to call..."></textarea></div>
      <h3 style="font-size:20px;margin:22px 0 14px">Payment</h3>
      <div class="pay">
        <label><input type="radio" name="payment" value="Cash on delivery" checked>Cash on delivery</label>
        <label><input type="radio" name="payment" value="Card">Debit / credit card</label>
        <label><input type="radio" name="payment" value="Easypaisa / JazzCash">Easypaisa / JazzCash</label>
      </div>
      <p class="err" id="err"></p>
      <button class="btn btn-lime btn-block" id="place">Place order · ${rs(t.total)}</button>
      ${demo ? `<p class="muted" style="text-align:center;font-size:13px;margin-top:12px">Demo store: no payment is taken and nothing is shipped.</p>` : ""}
    </form>
    <aside class="panel sum">
      <h3 style="font-size:20px;margin-bottom:8px">Your order</h3>
      ${t.lines.map((l) => `<div class="cline" style="grid-template-columns:64px 1fr auto;padding:12px 0"><img src="${img("p-" + l.id)}" alt="" style="width:64px;height:64px"><div><b>${esc(l.p.name)}</b><br><small>Qty ${l.qty}</small></div><span>${rs(l.unit * l.qty)}</span></div>`).join("")}
      <div class="sum-row" style="margin-top:8px"><span>Subtotal</span><span>${rs(t.subtotal)}</span></div>
      <div class="sum-row"><span>Delivery</span><span>${t.delivery ? rs(t.delivery) : "Free"}</span></div>
      <div class="sum-row total"><span>Total</span><span>${rs(t.total)}</span></div>
    </aside>
  </div>`;
  $("#co").addEventListener("submit", submit);
}

async function submit(e) {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  const bad = [];
  if (d.name.trim().length < 2) bad.push("name");
  if (!/^[0-9+\-\s]{10,15}$/.test(d.phone.trim())) bad.push("phone");
  if (!/^\S+@\S+\.\S+$/.test(d.email.trim())) bad.push("email");
  if (!d.city) bad.push("city");
  if (d.address.trim().length < 6) bad.push("address");
  [...f.elements].forEach((el) => el.style && (el.style.borderColor = bad.includes(el.name) ? "var(--red)" : ""));
  if (bad.length) { $("#err").textContent = "Please check: " + bad.join(", ") + "."; f.elements[bad[0]].focus(); return; }
  $("#place").disabled = true; $("#place").textContent = "Placing order…";
  try {
    const o = await S.placeOrder({ name: d.name, phone: d.phone, email: d.email, city: d.city, address: d.address,
      notes: [d.router ? "Router: " + d.router : "", d.notes].filter(Boolean).join(". "), payment: d.payment });
    done(o); scrollTo(0, 0);
  } catch (err) { $("#err").textContent = err.message; $("#place").disabled = false; $("#place").textContent = "Try again"; }
}

function done(o) {
  const first = String(o.name || "").split(" ")[0];
  $("#root").innerHTML = `<div class="panel ok" style="max-width:640px;margin:0 auto;padding:44px 32px">
    <div class="tick">✓</div>
    <span class="eyebrow">Order ${esc(o.id)}</span>
    <h1 style="font-size:clamp(38px,5vw,56px);margin:14px 0">Shukriya, ${esc(first)}!</h1>
    <p class="muted">We'll confirm on WhatsApp in a few minutes and check that the cable matches your router. Lahore delivery next day, other cities in 2 to 3 days${o.payment === "Cash on delivery" ? ". Please keep the cash ready for the rider." : "."}</p>
    <div style="text-align:left;margin-top:26px">
      ${o.items.map((i) => `<div class="sum-row"><span>${i.qty} × ${esc(i.name)}</span><span>${rs(i.price * i.qty)}</span></div>`).join("")}
      <div class="sum-row"><span>Delivery</span><span>${o.delivery ? rs(o.delivery) : "Free"}</span></div>
      <div class="sum-row total"><span>Total · ${esc(o.payment)}</span><span>${rs(o.total)}</span></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:28px;flex-wrap:wrap"><a class="btn btn-lime" href="guide.html">Read the install guide</a><a class="btn btn-ghost" href="${BRAND.whatsapp}" target="_blank" rel="noopener">WhatsApp us</a></div>
  </div>`;
}
form();
</script>
<script src="../dativo-lead.js" defer></script>
</body>
</html>
