<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Render studio · Jugnu Power</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<!-- Internal tool: renders the product pictures in assets/img/p-*.webp (studio.html?id=mini&view=0). Not linked from the site. -->
<canvas id="c" width="1200" height="1200" style="width:600px;height:600px"></canvas>
<script type="module">
import { THREE, buildProduct, buildRouter, makeRenderer, studioEnv } from "./js/model.js";
import { PRODUCTS } from "./js/data.js";
await document.fonts.load('700 40px "Space Grotesk"');
const q = new URLSearchParams(location.search);
const id = q.get("id") || "mini", view = Number(q.get("view") || 0), mode = q.get("mode") || "mains";
const canvas = document.getElementById("c");
const r = makeRenderer(canvas); r.setPixelRatio(1); r.setSize(1200, 1200, false);
const scene = new THREE.Scene(); studioEnv(r, scene); scene.environmentIntensity = 0.9;
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.camera.left = key.shadow.camera.bottom = -3; key.shadow.camera.right = key.shadow.camera.top = 3; scene.add(key);
const rim = new THREE.DirectionalLight(0xc8ff3d, 0.8); rim.position.set(-4, 2, -3); scene.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.28 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const p = PRODUCTS.find((x) => x.id === id);
const obj = id === "router" ? buildRouter() : buildProduct(p.model);
const s = obj.userData.size; if (p?.model.kind !== "station" && p?.model.kind !== "cable") obj.position.y = s.h / 2 + 0.03;
obj.userData.setMode?.(mode); obj.userData.setLevel?.(mode === "battery" ? 0.7 : 1); obj.userData.update(1.2);
scene.add(obj);
const big = Math.max(s.w, s.h * 1.4, s.d);
const cam = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
const views = [[1.0, 0.55, 1.6], [-1.5, 0.75, 1.1], [0.0, 0.25, 2.0], [0.05, 2.4, 0.5]];
const v = views[view] || views[0];
const dist = big * 2.75 * (view === 1 ? 1.3 : view === 2 && id === "station" ? 1.2 : 1);
cam.position.set(v[0] * dist / 1.9, v[1] * dist / 1.9 + (s.h / 2), v[2] * dist / 1.9);
cam.lookAt(0, p?.model.kind === "station" ? s.h * 0.55 : s.h * 0.35, 0);
r.render(scene, cam);
window.done = true;
</script>
</body></html>
