services:
  web:
    build: .
    container_name: zoya-studio-web
    ports:
      - "8083:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: zoya-studio-api
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - enquiries:/app/data
    restart: unless-stopped

volumes:
  enquiries:
