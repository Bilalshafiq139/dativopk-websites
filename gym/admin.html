<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front desk · Fajr Athletic Club</title>
<meta name="description" content="Front desk panel for Fajr Athletic Club: free trials, membership sign-ups and messages.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0e11">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<style>
  .adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .side{background:#07090b;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
  .side .logo{margin:0 10px 30px}
  .side button{text-align:left;padding:12px;font-size:14.5px;color:#c9c4bb;display:flex;justify-content:space-between}
  .side button.on,.side button:hover{background:rgba(214,154,82,.1);color:var(--amber)}
  .side .badge{background:var(--amber);color:#000;border-radius:99px;font:700 11px/19px var(--sans);padding:0 7px}
  .side .bottom{margin-top:auto;display:grid;gap:4px}
  .side .bottom a,.side .bottom button{font-size:13px;color:var(--muted);padding:6px 12px}
  .content{padding:34px 36px 60px;min-width:0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
  .top h1{font-size:54px;font-style:italic}
  .flag{font-size:12px;color:var(--amber);border:1px solid rgba(214,154,82,.4);padding:6px 12px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);padding:20px}
  .kpi span{font:600 10.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .kpi b{display:block;font:400 42px/1.1 var(--serif);color:var(--amber);margin-top:10px}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  .bars{display:flex;align-items:flex-end;gap:8px;height:170px;margin-top:16px}
  .bars div{flex:1;background:linear-gradient(var(--amber),#8a5f2d);min-height:3px;position:relative}
  .bars div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--muted)}
  .hbar{display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;font-size:13.5px;margin:10px 0}
  .hbar .t{height:7px;background:rgba(255,255,255,.07)}
  .hbar .t i{display:block;height:100%;background:var(--amber)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font:600 10.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:12px 10px;border-bottom:1px solid var(--line)}
  td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  td small{color:var(--muted)}
  .sel{background:#0b0e11;color:var(--ink);border:1px solid var(--line);padding:8px 10px;font:inherit;font-size:13px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters button{border:1px solid var(--line);padding:9px 14px;font-size:12.5px;text-transform:capitalize;color:var(--muted)}
  .filters button.on{background:var(--ink);color:#0b0e11}
  .login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login form{width:min(420px,100%)}
  .msg{background:var(--card);border:1px solid var(--line);padding:20px;margin-bottom:12px}
  @media (max-width:900px){.adm{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.side .logo{width:100%;margin-bottom:10px}.side .bottom{display:none}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.content{padding:20px 14px}.hide-m{display:none}.top h1{font-size:40px}}
</style>
<div id="app"></div>
<script type="module">
import { PROGRAMS, PLANS, programById, rs } from "./js/data.js";
import * as S from "./js/store.js";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dt = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const demo = await S.isDemo();
let data = { trials: [], joins: [], messages: [] }, view = "overview", filter = "all";
document.documentElement.classList.add("js");
function loginView(err = "") {
  $("#app").innerHTML = `<div class="login"><form class="panel" id="lf"><a class="logo" href="index.html"><b>FAJR</b><small>Front desk</small></a>
    <h1 style="font-size:46px;font-style:italic;margin:22px 0 6px">Staff login</h1><p class="muted">Trials, sign-ups and messages.</p>
    <div class="field" style="margin-top:20px"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus></div>
    <p class="err">${esc(err)}</p><button class="btn btn-amber btn-block">Sign in</button>
    ${demo ? '<p class="muted" style="font-size:13px;text-align:center;margin-top:14px">Demo password: <b>admin123</b></p>' : ""}</form></div>`;
  $("#lf").onsubmit = async (e) => { e.preventDefault(); try { await S.login($("#pw").value); await load(); } catch (er) { loginView(er.message); } };
}
async function load() { try { data = await S.adminData(); } catch (e) { S.logout(); return loginView(e.message); } shell(); }
function shell() {
  const nt = data.trials.filter((x) => x.status === "new").length, nj = data.joins.filter((x) => x.status === "new").length, nm = data.messages.filter((x) => x.status === "new").length;
  $("#app").innerHTML = `<div class="adm"><nav class="side"><a class="logo" href="index.html"><b>FAJR</b><small>Front desk</small></a>
    ${[["overview", "Overview", 0], ["trials", "Free trials", nt], ["joins", "Sign-ups", nj], ["messages", "Messages", nm]].map(([k, l, c]) => `<button data-view="${k}" class="${view === k ? "on" : ""}">${l}${c ? `<span class="badge">${c}</span>` : ""}</button>`).join("")}
    <div class="bottom">${demo ? '<button id="reset">Reset demo data</button>' : ""}<a href="index.html">← View site</a><button id="out">Sign out</button></div></nav><section class="content" id="c"></section></div>`;
  draw();
}
const head = (t) => `<div class="top"><h1>${t}</h1>${demo ? '<span class="flag">Demo mode · saved in this browser</span>' : ""}</div>`;
const statusSel = (kind, r) => `<select class="sel" data-kind="${kind}" data-id="${r.id}">${S.STATUSES[kind].map((s) => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}</select>`;
function draw() {
  const c = $("#c");
  if (view === "overview") {
    const wk = data.trials.filter((t) => Date.now() - new Date(t.createdAt) < 7 * 864e5).length;
    const done = data.trials.filter((t) => ["attended", "joined", "no-show"].includes(t.status)), joined = data.trials.filter((t) => t.status === "joined").length;
    const active = data.joins.filter((j) => ["paid", "active"].includes(j.status));
    const mrr = active.reduce((s, j) => { const p = PLANS.find((x) => x.id === j.plan); return s + (p ? (j.plan === "annual" ? p.price / 12 : j.plan === "quarter" ? p.price / 3 : j.plan === "day" ? 0 : p.price) : 0); }, 0);
    const days = [...Array(10)].map((_, i) => { const d = new Date(Date.now() - (9 - i) * 864e5); return { l: d.getDate(), v: data.trials.filter((t) => new Date(t.createdAt).toDateString() === d.toDateString()).length }; });
    const max = Math.max(1, ...days.map((d) => d.v));
    const byProg = PROGRAMS.map((p) => [p.name, data.trials.filter((t) => t.program === p.id).length]); const maxP = Math.max(1, ...byProg.map((x) => x[1]));
    c.innerHTML = head("Overview") + `<div class="kpis"><div class="kpi"><span>Trials, 7 days</span><b>${wk}</b></div><div class="kpi"><span>Trial → member</span><b>${done.length ? Math.round((joined / done.length) * 100) : 0}%</b></div><div class="kpi"><span>Paying members</span><b>${active.length}</b></div><div class="kpi"><span>Monthly income</span><b>${rs(Math.round(mrr))}</b></div></div>
      <div class="grid2"><div class="panel"><span class="kicker">Trial requests per day</span><div class="bars" style="margin-bottom:24px">${days.map((d) => `<div style="height:${(d.v / max) * 100}%"><span>${d.l}</span></div>`).join("")}</div></div>
      <div class="panel"><span class="kicker">Trials by program</span>${byProg.map(([n, v]) => `<div class="hbar"><span>${esc(n)}</span><div class="t"><i style="width:${(v / maxP) * 100}%"></i></div><span>${v}</span></div>`).join("")}</div></div>`;
  }
  if (view === "trials" || view === "joins") {
    const rows = data[view].filter((r) => filter === "all" || r.status === filter);
    c.innerHTML = head(view === "trials" ? "Free trials" : "Sign-ups") + `<div class="filters">${["all", ...S.STATUSES[view]].map((s) => `<button data-f="${s}" class="${filter === s ? "on" : ""}">${s} (${s === "all" ? data[view].length : data[view].filter((r) => r.status === s).length})</button>`).join("")}</div>
      <div class="panel" style="padding:8px 16px;overflow:auto"><table><thead><tr><th>Ref</th><th>Name</th>${view === "trials" ? "<th>Class</th><th class='hide-m'>Goal</th>" : "<th>Plan</th><th class='hide-m'>Payment</th>"}<th>Status</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td><b>${esc(r.id)}</b><br><small>${dt(r.createdAt)}</small></td><td>${esc(r.name)}<br><small><a href="https://wa.me/92${esc(String(r.phone).replace(/\D/g, "").replace(/^0/, ""))}" target="_blank" rel="noopener">${esc(r.phone)}</a></small></td>
        ${view === "trials" ? `<td>${esc(programById(r.program)?.name || r.program)}<br><small>${esc(r.date)} · ${esc(r.time)}</small></td><td class="hide-m">${esc(r.goal)}</td>` : `<td>${esc(PLANS.find((p) => p.id === r.plan)?.name || r.plan)}<br><small>${rs(PLANS.find((p) => p.id === r.plan)?.price || 0)}</small></td><td class="hide-m">${esc(r.payment)}</td>`}
        <td>${statusSel(view, r)}</td></tr>`).join("") || '<tr><td colspan="5" class="muted">Nothing here.</td></tr>'}</tbody></table></div>`;
  }
  if (view === "messages") {
    c.innerHTML = head("Messages") + (data.messages.map((m) => `<div class="msg"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b>${esc(m.name)}</b> <small class="muted">· ${esc(m.topic)} · ${dt(m.createdAt)} ${m.phone ? "· " + esc(m.phone) : ""}</small></div>${statusSel("messages", m)}</div><p style="margin-top:10px">${esc(m.message)}</p></div>`).join("") || '<p class="muted">No messages.</p>');
  }
}
document.addEventListener("click", async (e) => {
  const v = e.target.closest("[data-view]"); if (v) { view = v.dataset.view; filter = "all"; shell(); return; }
  const f = e.target.closest("[data-f]"); if (f) { filter = f.dataset.f; draw(); return; }
  if (e.target.closest("#out")) { S.logout(); loginView(); }
  if (e.target.closest("#reset") && confirm("Reset all demo data?")) { S.resetDemo(); await load(); }
});
document.addEventListener("change", async (e) => {
  const s = e.target.closest("select[data-kind]"); if (!s) return;
  const r = await S.update(s.dataset.kind, s.dataset.id, { status: s.value });
  Object.assign(data[s.dataset.kind].find((x) => x.id === s.dataset.id), r); s.style.outline = "1px solid var(--amber)"; setTimeout(() => (s.style.outline = ""), 800);
});
S.loggedIn() ? load() : loginView();
</script>
<script src="../dativo-lead.js" defer></script>
</body>
</html>
