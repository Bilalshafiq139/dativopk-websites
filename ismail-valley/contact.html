<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Ismail Valley</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main id="main" class="page-top">
  <section class="page-hero"><img src="assets/img/real/gate-1.webp" alt=""><div class="wrap"><p class="crumbs">Home / Contact</p><h1 class="rise">Visit the site office</h1><p class="rise" style="animation-delay:.15s">Main Daewoo Road, Faisalabad. Call, WhatsApp or send a message and our sales team will get back to you.</p></div></section>
  <section class="sec-tight"><div class="wrap split" style="align-items:start">
    <form class="card reveal" id="cf" novalidate>
      <h2 style="font-size:30px;margin-bottom:16px">Send a message</h2>
      <div class="form2">
        <div class="field"><label for="n">Name</label><input id="n" name="name" autocomplete="name"></div>
        <div class="field"><label for="p">Mobile</label><input id="p" name="phone" autocomplete="tel" placeholder="03xx xxxxxxx"></div>
        <div class="field full"><label for="t">About</label><select id="t" name="topic"><option>Plot booking</option><option>Payment plan</option><option>Site visit</option><option>NOC / approval</option><option>Construction</option><option>Other</option></select></div>
        <div class="field full"><label for="m">Message</label><textarea id="m" name="message"></textarea></div>
      </div>
      <p id="err" class="small" style="color:#b3261e;margin:0 0 8px"></p>
      <button class="btn btn-green">Send</button>
    </form>
    <div>
      <div class="dist">
        <div class="reveal"><span>Phone / WhatsApp</span><b>+92 300 0000000</b></div>
        <div class="reveal" style="--i:1"><span>Email</span><b>info@ismailvalley.example</b></div>
        <div class="reveal" style="--i:2"><span>Site office</span><b>Main Daewoo Road</b></div>
        <div class="reveal" style="--i:3"><span>Timing</span><b>Daily 10am to 7pm</b></div>
      </div>
      <div class="map reveal" style="margin-top:14px;min-height:340px"><iframe title="Map" loading="lazy" style="min-height:340px" src="https://maps.google.com/maps?q=Ismail%20Valley%20Daewoo%20Road%20Faisalabad&z=13&output=embed"></iframe></div>
    </div>
  </div></section>
</main>
<script type="module">
import { init, $ } from "./js/layout.js";
import * as S from "./js/store.js";
await init("contact");
$("#cf").addEventListener("submit", async (e) => {
  e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
  if (d.name.trim().length < 2 || !/^[0-9+\-\s]{10,16}$/.test(d.phone.trim()) || d.message.trim().length < 3) { $("#err").textContent = "Please add your name, mobile number and a message."; return; }
  try { await S.sendMessage(d); e.target.innerHTML = '<div class="ok"><div class="tick">✓</div><h2 style="font-size:28px">Message sent</h2><p class="muted">Our team will call you back soon.</p></div>'; } catch (er) { $("#err").textContent = er.message; }
});
</script>
</body>
</html>
