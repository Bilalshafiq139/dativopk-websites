<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..500,50;1,9..144,300..500,50&family=Geist:wght@400;500;600;800&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
<title>Store admin · Lakri &amp; Co.</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body { background: var(--bg2); }
  .adm { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  .side { background: var(--ink); color: #d9d0c3; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  .side .logo { color: #f5efe6; margin: 0 8px 26px; }
  .side button { text-align: left; background: none; border: 0; color: inherit; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; }
  .side button.on, .side button:hover { background: #2c2824; color: #fff; }
  .side .badge { background: var(--clay); color: #fff; border-radius: 99px; font-size: 11px; padding: 1px 7px; }
  .side .bottom { margin-top: auto; display: grid; gap: 6px; font-size: 12.5px; }
  .side .bottom a { color: #b9afa3; }
  .content { padding: 30px 34px 60px; min-width: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 46px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi { background: var(--paper); border-radius: 16px; padding: 18px 20px; border: 1px solid var(--line); }
  .kpi b { display: block; font-family: var(--serif); font-weight: 300; font-size: 34px; letter-spacing: -.02em; margin-top: 6px; }
  .two { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding-top: 10px; }
  .bars div { flex: 1; background: var(--wood); border-radius: 6px 6px 2px 2px; min-height: 3px; position: relative; opacity: .85; }
  .bars div:hover { opacity: 1; }
  .bars div span { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); }
  .hbar { display: grid; grid-template-columns: 110px 1fr 40px; gap: 10px; align-items: center; font-size: 13px; margin: 8px 0; }
  .hbar .t { height: 8px; background: var(--bg2); border-radius: 8px; overflow: hidden; }
  .hbar .t span { display: block; height: 100%; background: var(--ink); border-radius: 8px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 400; padding: 10px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: var(--bg); }
  .st { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 11.5px; background: var(--bg2); white-space: nowrap; }
  .st-new { background: #f4dfd5; color: #8a3a21; } .st-confirmed { background: #e9e1c9; color: #6a5520; } .st-in { background: #e3dbcf; color: #5a4632; }
  .st-dispatched { background: #dde3ea; color: #2f4560; } .st-delivered { background: #dbe6d8; color: #2f5530; } .st-cancelled { background: #e7e3df; color: #8a817a; text-decoration: line-through; }
  .st-replied { background: #dde3ea; color: #2f4560; } .st-closed { background: #e7e3df; color: #8a817a; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .search { height: 38px; border-radius: 99px; border: 1px solid var(--line); background: var(--paper); padding: 0 16px; min-width: 220px; }
  .detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--paper); z-index: 80; box-shadow: -30px 0 60px -30px rgba(0,0,0,.35); padding: 26px; overflow: auto; transform: translateX(100%); transition: transform .45s var(--ease); }
  .detail.open { transform: none; }
  .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
  .num { width: 120px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login form { width: min(400px, 100%); }
  .demo-flag { background: #f4dfd5; color: #8a3a21; padding: 4px 12px; border-radius: 99px; font-size: 12px; }
  @media (max-width: 900px) {
    .adm { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; }
    .side .logo { margin: 0 12px 0 4px; width: 100%; }
    .side .bottom { display: none; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .two { grid-template-columns: 1fr; }
    .content { padding: 20px 16px 50px; }
    .hide-m { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { WOODS, PRODUCTS, img, money } from "./js/data.js";
import * as S from "./js/store.js";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stCls = (s) => "st st-" + String(s).split(" ")[0];
const dt = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const demo = await S.isDemo();
let data = { orders: [], messages: [] }, view = "overview", filter = "all", search = "";

function loginView(err = "") {
  $("#app").innerHTML = `<div class="login"><form class="panel" id="lf">
    <a class="logo" href="index.html">lakri<span>&amp;co.</span></a>
    <h1 style="font-size:40px;margin:18px 0 6px">Store <em>admin</em></h1>
    <p class="muted">Orders, products and messages.</p>
    <div class="field" style="margin-top:20px"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus></div>
    <p style="color:var(--clay);font-size:13px;min-height:18px;margin:8px 0">${esc(err)}</p>
    <button class="btn btn-dark btn-block">Sign in</button>
    ${demo ? `<p class="muted small" style="margin-top:14px;text-align:center">Demo password: <b>admin123</b></p>` : ""}
  </form></div>`;
  $("#lf").addEventListener("submit", async (e) => { e.preventDefault(); try { await S.login($("#pw").value); await load(); } catch (er) { loginView(er.message); } });
}

async function load() {
  try { data = await S.adminData(); } catch (e) { S.logout(); return loginView(e.message); }
  await S.loadOverrides();
  shell();
}

function shell() {
  const newOrders = data.orders.filter((o) => o.status === "new").length;
  const newMsgs = data.messages.filter((m) => m.status === "new").length;
  $("#app").innerHTML = `<div class="adm">
    <nav class="side" aria-label="Admin">
      <a class="logo" href="index.html">lakri<span>&amp;co.</span></a>
      ${[["overview", "Overview", 0], ["orders", "Orders", newOrders], ["products", "Products", 0], ["messages", "Messages", newMsgs]].map(([id, l, n]) => `<button data-view="${id}" class="${view === id ? "on" : ""}">${l}${n ? `<span class="badge">${n}</span>` : ""}</button>`).join("")}
      <div class="bottom">${demo ? `<button id="reset" style="padding:6px 12px">Reset demo data</button>` : ""}<a href="index.html">← View store</a><button id="out" style="padding:6px 12px">Sign out</button></div>
    </nav>
    <section class="content" id="content"></section>
  </div><aside class="detail" id="detail" aria-label="Order detail"></aside>`;
  draw();
}

function draw() {
  const c = $("#content");
  const head = (t, extra = "") => `<div class="top"><h1>${t}</h1><div style="display:flex;gap:10px;align-items:center">${demo ? '<span class="demo-flag">Demo mode · saved in this browser</span>' : ""}${extra}</div></div>`;
  const live = data.orders.filter((o) => o.status !== "cancelled");
  if (view === "overview") {
    const month = live.filter((o) => Date.now() - new Date(o.createdAt) < 30 * 864e5);
    const rev = month.reduce((s, o) => s + o.total, 0);
    const open = data.orders.filter((o) => ["new", "confirmed", "in workshop", "dispatched"].includes(o.status)).length;
    const days = [...Array(14)].map((_, i) => { const d = new Date(Date.now() - (13 - i) * 864e5); const key = d.toDateString(); return { l: d.getDate(), v: live.filter((o) => new Date(o.createdAt).toDateString() === key).reduce((s, o) => s + o.total, 0) }; });
    const maxD = Math.max(1, ...days.map((d) => d.v));
    const prod = {}; live.forEach((o) => o.items.forEach((i) => (prod[i.name] = (prod[i.name] || 0) + i.qty)));
    const top = Object.entries(prod).sort((a, b) => b[1] - a[1]).slice(0, 6); const maxP = Math.max(1, ...top.map((t) => t[1]));
    const woods = {}; live.forEach((o) => o.items.forEach((i) => (woods[i.wood] = (woods[i.wood] || 0) + i.qty)));
    c.innerHTML = head("Overview") + `
      <div class="kpis">
        <div class="kpi"><span class="mono">Sales, 30 days</span><b>${money(rev)}</b></div>
        <div class="kpi"><span class="mono">Orders, 30 days</span><b>${month.length}</b></div>
        <div class="kpi"><span class="mono">Average order</span><b>${money(month.length ? rev / month.length : 0)}</b></div>
        <div class="kpi"><span class="mono">Open orders</span><b>${open}</b></div>
      </div>
      <div class="two">
        <div class="panel"><span class="mono">Sales by day, last 14 days</span><div class="bars" style="margin-bottom:24px">${days.map((d) => `<div style="height:${(d.v / maxD) * 100}%" title="${money(d.v)}"><span>${d.l}</span></div>`).join("")}</div></div>
        <div class="panel"><span class="mono">Wood chosen</span>${WOODS.map((w) => { const n = woods[w.name] || 0; const tot = Object.values(woods).reduce((a, b) => a + b, 0) || 1; return `<div class="hbar"><span><i class="sw" style="background:${w.color}"></i> ${w.short}</span><div class="t"><span style="width:${(n / tot) * 100}%;background:${w.color}"></span></div><span>${Math.round((n / tot) * 100)}%</span></div>`; }).join("")}</div>
      </div>
      <div class="two" style="margin-top:14px">
        <div class="panel"><span class="mono">Latest orders</span><table class="tbl" style="margin-top:8px"><tbody>${data.orders.slice(0, 5).map((o) => `<tr class="click" data-order="${o.id}"><td><b>${o.id}</b><br><span class="muted small">${dt(o.createdAt)}</span></td><td>${esc(o.name)}<br><span class="muted small">${esc(o.city)}</span></td><td>${money(o.total)}</td><td><span class="${stCls(o.status)}">${o.status}</span></td></tr>`).join("")}</tbody></table></div>
        <div class="panel"><span class="mono">Best sellers</span>${top.map(([n, q]) => `<div class="hbar"><span>${esc(n)}</span><div class="t"><span style="width:${(q / maxP) * 100}%"></span></div><span>${q}</span></div>`).join("")}</div>
      </div>`;
  }
  if (view === "orders") {
    const list = data.orders.filter((o) => (filter === "all" || o.status === filter) && (!search || (o.id + o.name + o.city + o.phone).toLowerCase().includes(search.toLowerCase())));
    c.innerHTML = head("Orders") + `
      <div class="filters"><input class="search" id="q" placeholder="Search order, name, city" value="${esc(search)}">
        ${["all", ...S.STATUSES].map((s) => `<button class="chip ${filter === s ? "on" : ""}" data-filter="${s}">${s}<sup>${s === "all" ? data.orders.length : data.orders.filter((o) => o.status === s).length}</sup></button>`).join("")}</div>
      <div class="panel" style="padding:8px 14px;overflow:auto"><table class="tbl"><thead><tr><th>Order</th><th>Customer</th><th class="hide-m">Items</th><th>Total</th><th>Status</th></tr></thead><tbody>
      ${list.map((o) => `<tr class="click" data-order="${o.id}"><td><b>${o.id}</b><br><span class="muted small">${dt(o.createdAt)}</span></td><td>${esc(o.name)}<br><span class="muted small">${esc(o.city)} · ${esc(o.phone)}</span></td><td class="hide-m">${o.items.map((i) => `${i.qty}× ${esc(i.name)} <span class="muted small">(${esc(i.wood)})</span>`).join("<br>")}</td><td>${money(o.total)}</td><td><span class="${stCls(o.status)}">${o.status}</span></td></tr>`).join("") || `<tr><td colspan="5" class="muted" style="text-align:center;padding:40px">No orders match.</td></tr>`}
      </tbody></table></div>`;
    $("#q").addEventListener("input", (e) => { search = e.target.value; const pos = e.target.selectionStart; draw(); $("#q").focus(); $("#q").setSelectionRange(pos, pos); });
  }
  if (view === "products") {
    const ps = S.products();
    c.innerHTML = head("Products", `<span class="muted small">Changes show on the store right away.</span>`) + `
      <div class="panel" style="padding:8px 14px;overflow:auto"><table class="tbl"><thead><tr><th></th><th>Piece</th><th>Base price (oak)</th><th class="hide-m">Lead time</th><th>Status</th><th>Featured</th></tr></thead><tbody>
      ${ps.map((p) => `<tr data-prod="${p.id}"><td><img class="thumb" src="${img(p.img)}" alt=""></td><td><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.type)}</span></td>
        <td><input class="num" type="number" step="500" min="1000" value="${p.price}" data-price aria-label="Price for ${esc(p.name)}"></td><td class="hide-m">${p.weeks} weeks</td>
        <td><select class="sel" data-status aria-label="Status"><option value="active" ${p.status === "active" ? "selected" : ""}>Taking orders</option><option value="paused" ${p.status === "paused" ? "selected" : ""}>Paused (hidden)</option></select></td>
        <td><input type="checkbox" data-feat ${p.featured ? "checked" : ""} aria-label="Featured" style="width:18px;height:18px;accent-color:var(--ink)"></td></tr>`).join("")}
      </tbody></table></div>`;
  }
  if (view === "messages") {
    c.innerHTML = head("Messages") + `<div style="display:grid;gap:12px">${data.messages.map((m) => `<article class="panel" data-msg="${m.id}">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b>${esc(m.name)}</b> <span class="muted small">· ${esc(m.topic)} · ${dt(m.createdAt)}</span><br><span class="muted small">${esc(m.email)}${m.phone ? " · " + esc(m.phone) : ""}</span></div>
      <select class="sel" data-mstatus aria-label="Status">${S.MSG_STATUSES.map((s) => `<option ${m.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      <p style="margin:12px 0 0">${esc(m.message)}</p></article>`).join("") || '<p class="muted">No messages yet.</p>'}</div>`;
  }
}

function openOrder(id) {
  const o = data.orders.find((x) => x.id === id); if (!o) return;
  const d = $("#detail");
  d.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><span class="mono">${o.id} · ${new Date(o.createdAt).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}</span><button class="icon-btn" id="dClose" aria-label="Close">✕</button></div>
    <h2 style="font-size:40px;margin:16px 0 4px">${esc(o.name)}</h2>
    <p class="muted">${esc(o.phone)} · ${esc(o.email)}<br>${esc(o.address)}, ${esc(o.city)}</p>
    <div class="field" style="margin:18px 0"><label for="dSt">Status</label><select id="dSt">${S.STATUSES.map((s) => `<option ${o.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
    <div class="panel" style="padding:16px">${o.items.map((i) => `<div class="sum-row"><span>${i.qty} × <b>${esc(i.name)}</b> <span class="muted small">${esc(i.type || "")}<br>${esc(i.wood)}${i.fabric ? " · " + esc(i.fabric) : ""}</span></span><span>${money(i.price * i.qty)}</span></div>`).join("")}
      <div class="sum-row"><span>Delivery</span><span>${o.delivery ? money(o.delivery) : "Free"}</span></div>${o.whiteGlove ? `<div class="sum-row"><span>White-glove</span><span>${money(o.whiteGlove)}</span></div>` : ""}
      <div class="sum-total"><span>Total</span><b>${money(o.total)}</b></div><p class="muted small" style="margin:0">${esc(o.payment)}</p></div>
    <div class="field" style="margin-top:16px"><label for="dNotes">Internal notes</label><textarea id="dNotes">${esc(o.notes)}</textarea></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-dark" id="dSave">Save</button><a class="btn btn-line" target="_blank" rel="noopener" href="https://wa.me/92${esc(String(o.phone).replace(/\D/g, "").replace(/^0/, ""))}">WhatsApp customer</a></div>`;
  d.classList.add("open");
  $("#dClose").onclick = () => d.classList.remove("open");
  $("#dSave").onclick = async () => { Object.assign(o, await S.updateOrder(o.id, { status: $("#dSt").value, notes: $("#dNotes").value })); d.classList.remove("open"); shell(); };
}

document.addEventListener("click", async (e) => {
  const v = e.target.closest("[data-view]"); if (v) { view = v.dataset.view; shell(); return; }
  const f = e.target.closest("[data-filter]"); if (f) { filter = f.dataset.filter; draw(); return; }
  const r = e.target.closest("[data-order]"); if (r) { openOrder(r.dataset.order); return; }
  if (e.target.closest("#out")) { S.logout(); loginView(); }
  if (e.target.closest("#reset") && confirm("Reset all demo orders, messages and product edits?")) { S.resetDemo(); await load(); }
});
document.addEventListener("change", async (e) => {
  const row = e.target.closest("[data-prod]");
  if (row) {
    const id = row.dataset.prod;
    if (e.target.matches("[data-price]")) await S.updateProduct(id, { price: Math.max(1000, Number(e.target.value) || PRODUCTS.find((p) => p.id === id).price) });
    if (e.target.matches("[data-status]")) await S.updateProduct(id, { status: e.target.value });
    if (e.target.matches("[data-feat]")) await S.updateProduct(id, { featured: e.target.checked });
    e.target.style.outline = "2px solid #6a9a5f"; setTimeout(() => (e.target.style.outline = ""), 900);
  }
  const m = e.target.closest("[data-msg]");
  if (m && e.target.matches("[data-mstatus]")) { const res = await S.updateMessage(m.dataset.msg, { status: e.target.value }); Object.assign(data.messages.find((x) => x.id === m.dataset.msg), res); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#detail")?.classList.remove("open"); });

S.loggedIn() ? load() : loginView();
</script>
</body>
</html>
